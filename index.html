<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOL 推广数据管理系统 v6.3 - 稳定版</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root {
    --bg: #ffffff; --bg2: #f8f9fa; --bg3: #f1f3f5;
    --text: #212529; --text2: #6c757d;
    --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.18);
    --radius: 8px; --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1b1e; --bg2: #25262b; --bg3: #101113;
      --text: #c1c2c5; --text2: #909296;
      --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.16);
    }
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg3); color:var(--text); min-height:100vh; }
  .container { max-width:1280px; margin:0 auto; padding:2rem 1rem 4rem; }

  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:2rem; flex-wrap:wrap; gap:12px; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:var(--radius); border:1px solid var(--border2); background:var(--bg); color:var(--text); cursor:pointer; font-size:13px; transition:all .2s; }
  .btn:hover { background:var(--bg2); }
  .btn-primary { background:#3b82f6; color:#fff; border-color:#3b82f6; }
  .btn-primary:hover { background:#2563eb; }
  .btn-danger { background:#c92a2a; color:#fff; }

  .tabs { display:flex; gap:4px; background:var(--bg2); border-radius:var(--radius); padding:5px; margin-bottom:2rem; width:fit-content; border:1px solid var(--border); }
  .tab { padding:9px 18px; border-radius:6px; background:transparent; cursor:pointer; font-size:13px; color:var(--text2); }
  .tab.active { background:var(--bg); color:#3b82f6; font-weight:600; }

  .region-tabs { display:flex; gap:10px; margin-bottom:2rem; flex-wrap:wrap; }
  .rtab { padding:7px 16px; border-radius:20px; border:1px solid var(--border); background:var(--bg); cursor:pointer; }
  .rtab.active { border-color:#3b82f6; background:var(--bg2); font-weight:600; }

  .metrics-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:16px; margin-bottom:2rem; }
  .metric-card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1.4rem 1.2rem; }
  .metric-value { font-size:26px; font-weight:700; }

  .section { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-lg); padding:1.6rem; margin-bottom:1.6rem; }
  .upload-box { border:2px dashed #3b82f6; border-radius:var(--radius-lg); padding:3rem 2rem; text-align:center; background:rgba(59,130,246,0.03); cursor:pointer; }
  .upload-box:hover { background:rgba(59,130,246,0.08); }

  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { padding:12px; border-bottom:1px solid var(--border); text-align:left; }
  th { background:var(--bg2); color:var(--text2); }

  .toast { position:fixed; bottom:40px; left:50%; transform:translateX(-50%); background:#1f1f1f; color:#fff; padding:14px 28px; border-radius:8px; font-size:14px; opacity:0; transition:all .3s; z-index:10000; box-shadow:0 6px 20px rgba(0,0,0,0.25); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(-10px); }

  .month-picker-grid { display:flex; flex-wrap:wrap; gap:8px; max-height:140px; overflow-y:auto; padding:8px; border:1px solid var(--border2); border-radius:var(--radius); background:var(--bg); }
  .month-item { padding:5px 11px; background:var(--bg3); border-radius:5px; font-size:13px; cursor:pointer; user-select:none; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div>
      <h1 style="font-size:23px;font-weight:700;display:flex;align-items:center;gap:10px;">
        <i class="ti ti-chart-bar-popular"></i> KOL 推广数据管理系统
      </h1>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn" onclick="exportAllData()"><i class="ti ti-download"></i>备份全部数据</button>
      <button class="btn" onclick="document.getElementById('import-input').click()">恢复数据</button>
      <button class="btn btn-primary" onclick="showView('add')"><i class="ti ti-plus"></i>数据录入</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showView('dashboard')">数据总览</button>
    <button class="tab" onclick="showView('daily')">日报明细</button>
    <button class="tab" onclick="showView('weekly')">周区间核算</button>
    <button class="tab" onclick="showView('materials')">台土素材看板</button>
    <button class="tab" onclick="showView('add')">导入与录入</button>
  </div>

  <!-- 数据总览 -->
  <div id="view-dashboard" class="view">
    <div class="region-tabs">
      <button class="rtab active" onclick="setRegion('all')">全部地区</button>
      <button class="rtab" onclick="setRegion('TR')">🇹🇷 土耳其</button>
      <button class="rtab" onclick="setRegion('TW')">🇹🇼 台湾</button>
      <button class="rtab" onclick="setRegion('ES')">🌎 西语</button>
      <button class="rtab" onclick="setRegion('BR')">🇧🇷 巴西</button>
    </div>
    <div class="metrics-grid" id="metrics-grid"></div>
    <div class="section">
      <div class="section-header"><span class="section-title">多月度对比核算</span></div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;">
        <div style="flex:1;min-width:280px;"><label style="font-weight:600;color:var(--text2);">对比组 A</label><div class="month-picker-grid" id="group-a-months"></div></div>
        <div style="flex:1;min-width:280px;"><label style="font-weight:600;color:var(--text2);">对比组 B</label><div class="month-picker-grid" id="group-b-months"></div></div>
      </div>
      <div id="compare-results-wrap" style="margin-top:16px;"></div>
    </div>
  </div>

  <!-- 其他视图 -->
  <div id="view-daily" class="view" style="display:none;">
    <div class="section">
      <div class="section-header"><span class="section-title">日报明细</span></div>
      <div style="overflow-x:auto;">
        <table><thead><tr><th>日期</th><th>地区</th><th>渠道</th><th>消耗</th><th>新增用户</th><th>播放量</th><th>CPA</th><th>操作</th></tr></thead>
        <tbody id="daily-tbody"></tbody></table>
      </div>
    </div>
  </div>

  <div id="view-weekly" class="view" style="display:none;">
    <div class="section">
      <div class="section-header"><span class="section-title">周区间核算</span></div>
      <div style="overflow-x:auto;">
        <table><thead><tr><th>周区间</th><th>地区</th><th>消耗</th><th>新增用户</th><th>CPA</th></tr></thead>
        <tbody id="weekly-tbody"></tbody></table>
      </div>
    </div>
  </div>

  <div id="view-materials" class="view" style="display:none;">
    <div class="section">
      <div class="upload-box" onclick="document.getElementById('m-file-input').click()" ondragover="event.preventDefault()" ondrop="handleMaterialDrop(event)">
        <i class="ti ti-file-spreadsheet" style="font-size:48px;color:#0ca678"></i>
        <p>拖拽或点击上传台土素材表格</p>
        <input type="file" id="m-file-input" accept=".csv,.xlsx" style="display:none" onchange="handleMaterialFileSelect(event)">
      </div>
    </div>
    <div class="section">
      <div class="section-header"><span class="section-title">素材数据</span></div>
      <div style="overflow-x:auto;">
        <table><thead><tr><th>时间段</th><th>地区</th><th>SPK新增</th><th>SPK消耗</th><th>操作</th></tr></thead>
        <tbody id="materials-tbody"></tbody></table>
      </div>
    </div>
  </div>

  <div id="view-add" class="view" style="display:none;">
    <div class="section">
      <div class="upload-box" onclick="document.getElementById('file-input').click()" ondragover="event.preventDefault()" ondrop="handleDrop(event)">
        <i class="ti ti-copy-check"></i>
        <p>拖拽或点击上传大盘 Excel / CSV</p>
        <input type="file" id="file-input" accept=".csv,.xlsx" style="display:none" onchange="handleFileSelect(event)">
      </div>
    </div>
    <div class="section">
      <div class="section-header"><span class="section-title">手工录入</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;">
        <div><label>日期</label><input type="date" id="f-date" style="width:100%;padding:9px;"></div>
        <div><label>地区</label><select id="f-region" style="width:100%;padding:9px;">
          <option value="TR">🇹🇷 土耳其</option><option value="TW">🇹🇼 台湾</option><option value="ES">🌎 西语</option><option value="BR">🇧🇷 巴西</option>
        </select></div>
        <div><label>渠道</label><select id="f-channel" style="width:100%;padding:9px;">
          <option value="TikTok">TikTok</option><option value="YouTube">YouTube</option><option value="Instagram">Instagram</option>
        </select></div>
        <div><label>消耗 (USD)</label><input type="number" id="f-cost" step="0.01" style="width:100%;padding:9px;"></div>
        <div><label>新增用户</label><input type="number" id="f-users" style="width:100%;padding:9px;"></div>
        <div><label>播放量</label><input type="number" id="f-views" style="width:100%;padding:9px;"></div>
      </div>
      <button class="btn btn-primary" onclick="saveRecord()" style="margin-top:20px;">保存记录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
// ==================== 稳定存储 Key（重要！不要修改） ====================
const STORAGE_KEY = 'kol_records_v6_stable';
const MATERIAL_KEY = 'kol_materials_v6_stable';

let records = [];
let materialRecords = [];
let currentRegion = 'all';

// 加载数据
function loadData() {
  records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  materialRecords = JSON.parse(localStorage.getItem(MATERIAL_KEY) || '[]');
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  localStorage.setItem(MATERIAL_KEY, JSON.stringify(materialRecords));
}

// ==================== 备份与恢复 ====================
function exportAllData() {
  const backup = {
    version: "6.3",
    exportDate: new Date().toISOString(),
    records: records,
    materialRecords: materialRecords
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `KOL_全数据备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  toast('✅ 数据备份已下载，请妥善保存');
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const backup = JSON.parse(ev.target.result);
      if (backup.records) {
        records = backup.records || [];
        materialRecords = backup.materialRecords || [];
        saveData();
        toast('✅ 数据恢复成功！');
        showView('dashboard');
      }
    } catch(err) {
      toast('❌ 备份文件格式错误');
    }
  };
  reader.readAsText(file);
}

// ==================== 工具函数 ====================
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function sum(arr, key) {
  return arr.reduce((a, r) => a + (parseFloat(r[key]) || 0), 0);
}

// ==================== 视图切换 ====================
function showView(view) {
  document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
  document.getElementById('view-' + view).style.display = 'block';

  if (view === 'dashboard') { renderDashboard(); renderMonthPickers(); }
  if (view === 'daily') renderDaily();
  if (view === 'materials') renderMaterialsPanel();
}

function setRegion(r) {
  currentRegion = r;
  renderDashboard();
  renderMonthPickers();
}

// ==================== 核心功能 ====================
function renderDashboard() {
  const data = currentRegion === 'all' ? records : records.filter(r => r.region === currentRegion);
  const cost = sum(data, 'cost');
  const users = sum(data, 'users');
  const cpa = users > 0 ? (cost / users).toFixed(2) : '0.00';

  document.getElementById('metrics-grid').innerHTML = `
    <div class="metric-card"><div class="metric-label">总消耗 (USD)</div><div class="metric-value">$${cost.toLocaleString()}</div></div>
    <div class="metric-card"><div class="metric-label">总新增用户</div><div class="metric-value">${users.toLocaleString()} 人</div></div>
    <div class="metric-card"><div class="metric-label">综合 CPA</div><div class="metric-value">$${cpa}</div></div>
  `;
}

function saveRecord() {
  const record = {
    id: Date.now().toString(36),
    date: document.getElementById('f-date').value || new Date().toISOString().slice(0,10),
    region: document.getElementById('f-region').value,
    channel: document.getElementById('f-channel').value,
    cost: parseFloat(document.getElementById('f-cost').value) || 0,
    users: parseFloat(document.getElementById('f-users').value) || 0,
    views: parseFloat(document.getElementById('f-views').value) || 0
  };
  records.unshift(record);
  saveData();
  toast('✅ 保存成功');
  renderDaily();
}

function renderDaily() {
  const tbody = document.getElementById('daily-tbody');
  tbody.innerHTML = records.length === 0 
    ? `<tr><td colspan="8" style="text-align:center;padding:60px;color:#888">暂无数据</td></tr>`
    : records.map(r => `
      <tr>
        <td>${r.date}</td>
        <td>${r.region}</td>
        <td>${r.channel}</td>
        <td>$${r.cost}</td>
        <td>${r.users}</td>
        <td>${r.views}</td>
        <td>$${(r.users ? (r.cost/r.users).toFixed(2) : '—')}</td>
        <td><button onclick="deleteRecord('${r.id}')" style="color:#c92a2a">删除</button></td>
      </tr>`).join('');
}

function deleteRecord(id) {
  if (confirm('确定删除？')) {
    records = records.filter(r => r.id !== id);
    saveData();
    renderDaily();
    toast('已删除');
  }
}

// 文件导入
function handleFileSelect(e) { processFile(e.target.files[0]); }
function handleDrop(e) { e.preventDefault(); if(e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]); }

function processFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const wb = XLSX.read(e.target.result, {type:'array'});
    const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
    data.forEach(row => {
      records.push({
        id: Date.now().toString(36),
        date: row['日期'] || new Date().toISOString().slice(0,10),
        region: row['地区'] || 'TR',
        channel: row['渠道'] || 'TikTok',
        cost: parseFloat(row['消耗'] || 0),
        users: parseFloat(row['新增'] || 0),
        views: parseFloat(row['播放'] || 0)
      });
    });
    saveData();
    toast(`✅ 成功导入 ${data.length} 条记录`);
    renderDaily();
  };
  reader.readAsArrayBuffer(file);
}

// 其他简化功能
function renderMonthPickers() { /* 可自行扩展 */ document.getElementById('group-a-months').innerHTML = '<div style="color:#888;padding:10px;">月份选择器（可扩展）</div>'; }
function calculateComparison() {}
function renderMaterialsPanel() { document.getElementById('materials-tbody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:#888">暂无素材数据</td></tr>'; }
function renderWeekly() { document.getElementById('weekly-tbody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:#888">周报功能待扩展</td></tr>'; }
function handleMaterialDrop(e){e.preventDefault(); toast('素材上传功能保留');}
function handleMaterialFileSelect(e){ toast('素材文件已接收'); }

// 初始化
loadData();
showView('dashboard');
</script>
</body>
</html>
